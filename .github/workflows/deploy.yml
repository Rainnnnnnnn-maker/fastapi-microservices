name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install locked dependencies
        run: |
          uv sync --frozen --python 3.14
          npm ci
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          python - <<'PY'
          from pathlib import Path

          config = Path("wrangler.jsonc").read_text()
          if "REPLACE_WITH_D1_DATABASE_ID" in config:
              raise SystemExit("Replace the D1 database_id in wrangler.jsonc before deployment")
          PY
      - name: Check Worker secrets exist
        run: |
          for config in wrangler.jsonc wrangler.demand.jsonc; do
            npx --no-install wrangler secret list --format json -c "$config" > "$RUNNER_TEMP/worker-secrets.json"
            python -c 'import json,sys; secrets=json.load(open(sys.argv[1])); assert any(s["name"] == "API_TOKEN" for s in secrets), "Set API_TOKEN on both Workers first"' "$RUNNER_TEMP/worker-secrets.json"
          done
      - name: Apply telemetry database migrations
        run: uv run --frozen pywrangler d1 migrations apply ems-telemetry-staging --remote -c wrangler.jsonc
      - name: Deploy telemetry Worker
        run: uv run --frozen pywrangler deploy -c wrangler.jsonc
      - name: Deploy demand Worker
        run: uv run --frozen pywrangler deploy -c wrangler.demand.jsonc
